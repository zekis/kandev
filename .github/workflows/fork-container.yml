name: Fork container
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: fork-container-main
  cancel-in-progress: true
jobs:
  build:
    if: github.repository_owner != 'kdlbs'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: '9.15.9'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Build web and runtime from this commit
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_KANDEV_API_PORT: ''
          VITE_KANDEV_DEBUG: ''
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/cli/package.json').version")-fork.sha${GITHUB_SHA:0:12}"
          echo "FORK_VERSION=$version" >> "$GITHUB_ENV"
          pnpm -C apps install --frozen-lockfile
          KANDEV_VERSION="$version" pnpm -C apps --filter @kandev/web build
          cp -a apps/web/dist/. apps/backend/internal/webapp/embedded/generated/
          make -C apps/backend build-runtime VERSION="$version" COMMIT="$GITHUB_SHA" GOFLAGS=
          mkdir -p ctx/bundle/bin
          cp apps/backend/bin/kandev apps/backend/bin/agentctl apps/backend/bin/agentctl-* ctx/bundle/bin/
          cp docker-entrypoint.sh ctx/
      - name: Login to fork registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build, smoke test, then publish
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          docker buildx build --load --file Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$FORK_VERSION" \
            --tag "$image:sha-$GITHUB_SHA" ./ctx
          docker run --rm --entrypoint kandev "$image:sha-$GITHUB_SHA" --version
          docker run -d --name fork-smoke -p 127.0.0.1:38429:38429 "$image:sha-$GITHUB_SHA"
          trap 'docker logs --tail 60 fork-smoke; docker rm -fv fork-smoke' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:38429/ready >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker push "$image:sha-$GITHUB_SHA"
          docker tag "$image:sha-$GITHUB_SHA" "$image:main"
          docker push "$image:main"
